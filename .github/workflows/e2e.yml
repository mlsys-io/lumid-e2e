name: e2e

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    # Nightly 04:00 UTC — full suite on both browsers
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  playwright:
    # PR runs: chromium only, skip OAuth (already skipped), skip TC14.
    # Nightly: both browsers.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: https://lum.id
      E2E_GMAIL_USER: ${{ secrets.E2E_GMAIL_USER }}
      E2E_GMAIL_APP_PASSWORD: ${{ secrets.E2E_GMAIL_APP_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_INVITATION_CODE: ${{ secrets.E2E_INVITATION_CODE }}
      # Dedicated CI admin PAT (lumid:read+write, expiring). The admin fixture
      # uses it when no password is set, and specs 28-32 read it from
      # ~/.lumid/admin.pat (written below). Unset -> those specs skip.
      E2E_ADMIN_PAT: ${{ secrets.E2E_ADMIN_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Write admin PAT
        if: env.E2E_ADMIN_PAT != ''
        run: |
          mkdir -p ~/.lumid && umask 077
          printf '%s' "$E2E_ADMIN_PAT" > ~/.lumid/admin.pat
      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright install --with-deps chromium firefox
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright test
          else
            # PR/push runs skip @stress: it loads production, and it ran in
            # parallel with the doc harnesses, which then timed out on slow
            # pages (2026-09-27: 51/53 and 22/24 in runs where it executed,
            # 53/53 and 24/24 where it did not). Nightly still runs it.
            npx playwright test --project=chromium --grep-invert @stress
          fi
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  playwright-lqt:
    # LQT persona specs — gated on LUMID_E2E_LQT_GATEWAY_URL being set.
    # Off by default so the existing playwright job keeps green on runners
    # that can't reach the LQT gateway.
    if: vars.LUMID_E2E_LQT_GATEWAY_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://lum.id
      LUMID_E2E_LQT: "1"
      LUMID_E2E_LQT_GATEWAY_URL: ${{ vars.LUMID_E2E_LQT_GATEWAY_URL }}
      E2E_GMAIL_USER: ${{ secrets.E2E_GMAIL_USER }}
      E2E_GMAIL_APP_PASSWORD: ${{ secrets.E2E_GMAIL_APP_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_INVITATION_CODE: ${{ secrets.E2E_INVITATION_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run LQT persona tests
        run: npx playwright test tests/lqt-*.spec.ts --project=chromium
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lqt-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  cli-lifecycle:
    # TC14 runs docker-in-docker. Nightly only, not on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_E2E_DOCKER: "1"
      LUMID_IDENTITY_URL: https://lum.id
      LUMID_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      LUMID_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # Quarantine switch: this job needs a LumidOS checkout token and the admin
      # login, and CI has had neither since 2026-06-24, so it failed on every
      # run. Without them it now says so and skips instead of going red.
      # The LumidOS checkout uses a read-only deploy key (LUMIDOS_DEPLOY_KEY,
      # added 2026-09-27). TC14 logs in with the admin PASSWORD to mint a PAT
      # (a PAT cannot mint one), so it stays quarantined until that is set.
      HAS_SECRETS: ${{ secrets.LUMIDOS_DEPLOY_KEY != '' && secrets.E2E_ADMIN_PASSWORD != '' }}
    steps:
      - if: env.HAS_SECRETS != 'true'
        run: echo "::notice title=cli-lifecycle quarantined::E2E_ADMIN_PASSWORD (and/or LUMIDOS_DEPLOY_KEY) is not configured; TC14 skipped."
      - if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v4
        with:
          repository: mlsys-io/LumidOS
          path: LumidOS
          ssh-key: ${{ secrets.LUMIDOS_DEPLOY_KEY }}
      - if: env.HAS_SECRETS == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: env.HAS_SECRETS == 'true'
        run: pip install requests
      - if: env.HAS_SECRETS == 'true'
        run: python3 LumidOS/tests/integration/test_case_14_install_lifecycle.py

  doc-harnesses:
    # Row 9: the doc harnesses must pass in CI. Each is a standalone .mjs that
    # walks the live docs as the non-admin reader and asserts every named UI
    # element exists (docs-fresh-user: pages render; docs-ui-claims: the doc's
    # claims are true). Exit 2 on any failed check. Runs on every push/PR so a
    # doc claim that rots fails the build.
    # After playwright, not beside it: both drive production, and the doc
    # harnesses' fixed page waits flaked when they competed. always() so a
    # red playwright still gets its docs checked.
    needs: [playwright]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://lum.id
      PAT_FILE: /tmp/doc-e2e.pat
      # Operator token for claims about PUBLISHED specs the reader cannot read;
      # used by a plain fetch only, never in a browser context.
      E2E_ADMIN_PAT: ${{ secrets.E2E_ADMIN_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Write non-admin PAT
        run: printf '%s' "${{ secrets.DOC_E2E_PAT }}" > "$PAT_FILE"
      - name: Run docs-fresh-user harness
        run: node docs-fresh-user-e2e.mjs
      - name: Run docs-ui-claims harness
        run: node docs-ui-claims-e2e.mjs

  fresh-user-auto-quant:
    # Long auto-quant e2e — 5 parallel fresh users, each installs the
    # CLI in a docker container and runs a paper cycle. Nightly only
    # (slow, docker-in-docker, mints PATs against prod). Needs a runner
    # with docker daemon available.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # KNOWN RED, not gating (2026-09-28): the spec installs via
    # `curl lum.id/start | bash`, and /start 404s — the landing runs
    # lumid-landing-readdy:v1.0.0, not the landing-installer overlay that
    # baked install.sh in. The local install was retired in July (WS5), so
    # whether /start comes back is a product decision. The job still FAILS
    # visibly (assert-ran) rather than skipping; drop this line once decided.
    continue-on-error: true
    # One at a time: the end-of-job sweep deletes this job's lumid-e2e-aq-*
    # accounts, which must not be a concurrent run's live ones.
    concurrency:
      group: fresh-user-auto-quant
      cancel-in-progress: false
    env:
      BASE_URL: https://lum.id
      CI_E2E_LONG: "1"
      CI_E2E_LONG_USERS: "5"
      # OTP + invite + cleanup all come from the admin (not super_admin) PAT
      # CI already holds — see the fresh-user-journey job for the why.
      E2E_ADMIN_PAT: ${{ secrets.E2E_ADMIN_PAT }}
      CI_E2E_LOCAL_OTP: "1"
      LUMID_OTP_TRANSPORT: api
      PLAYWRIGHT_JSON_OUTPUT_NAME: pw-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Verify docker available
        run: docker info
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Mint invitation code for this run
        run: node ci/fresh-user-ci.mjs mint-invite "e2e:fresh-user-auto-quant run ${{ github.run_id }}" 5
      - name: Run fresh-user auto-quant spec
        run: npx playwright test tests/12-fresh-user-auto-quant.spec.ts --project=chromium --reporter=list,json,html
      - name: Fail if the spec did not actually run
        if: ${{ !cancelled() }}
        run: node ci/fresh-user-ci.mjs assert-ran pw-results.json 1
      - name: Revoke invitation code and delete this job's accounts
        if: ${{ always() }}
        run: |
          node ci/fresh-user-ci.mjs revoke-invite || true
          node ci/fresh-user-ci.mjs sweep lumid-e2e-aq- 0 || true
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auto-quant-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  fresh-user-journey:
    # Row 10: the fresh-user journey, walked unaided through the UI as a
    # brand-new non-admin. Creates a real account (zero apps), mints a PAT,
    # installs Quant Research, submits a strategy, backtests, and reads the
    # three-axis honesty table. Nightly only (slow, mints PATs against prod,
    # and the backtest→verdict half depends on the worker draining). No docker
    # needed — this is a pure UI walk, unlike fresh-user-auto-quant.
    #
    # Until 2026-09-28 this job ran 0 tests (no OTP source, no invitation
    # code) and concluded success. Now, from the admin (NOT super_admin) PAT
    # CI already holds, and with no cluster access:
    #   invite  — minted per run (single use, 1-day TTL, note names the run),
    #             revoked at the end;
    #   OTP     — identity's GET /api/v1/admin/e2e/signup-otp, which serves only
    #             lumid-e2e-…@yao.lu test addresses (LUMID_OTP_TRANSPORT=api);
    #   cleanup — the spec deletes its account; a sweep removes any
    #             lumid-e2e-fresh-* account a crashed run left (> 60 min old).
    # E2E_FRESH_REQUIRE=1 makes "cannot run" a failure, and assert-ran fails
    # the job unless >= 1 test passed and none skipped.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: fresh-user-journey
      cancel-in-progress: false
    env:
      BASE_URL: https://lum.id
      CI_E2E_LONG: "1"
      E2E_FRESH_REQUIRE: "1"
      E2E_ADMIN_PAT: ${{ secrets.E2E_ADMIN_PAT }}
      CI_E2E_LOCAL_OTP: "1"
      LUMID_OTP_TRANSPORT: api
      PLAYWRIGHT_JSON_OUTPUT_NAME: pw-results.json
      E2E_FRESH_LEDGER: fresh-user-journey.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Mint invitation code for this run
        run: node ci/fresh-user-ci.mjs mint-invite "e2e:fresh-user-journey run ${{ github.run_id }}" 1
      - name: Run fresh-user journey spec
        run: npx playwright test tests/fresh-user-journey.spec.ts --project=chromium --reporter=list,json,html
      - name: Step ledger
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$E2E_FRESH_LEDGER" ]; then
            cat "$E2E_FRESH_LEDGER"
            cat "$E2E_FRESH_LEDGER" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no step ledger written"
          fi
      - name: Fail if the journey did not actually run
        if: ${{ !cancelled() }}
        run: node ci/fresh-user-ci.mjs assert-ran pw-results.json 1
      - name: Revoke invitation code and sweep stale journey accounts
        if: ${{ always() }}
        run: |
          node ci/fresh-user-ci.mjs revoke-invite || true
          node ci/fresh-user-ci.mjs sweep lumid-e2e-fresh- 60 || true
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fresh-user-journey-report-${{ github.run_id }}
          path: |
            playwright-report/
            fresh-user-journey.md
            pw-results.json
          retention-days: 7

  persona-undergrad:
    # GOALS.md row 18 — "Undergrad journey stages that fail", J1–J9. A fresh
    # role=user undergrad walks lum.id → Marketplace → Quant Research → chat
    # writes a strategy → Backtest → judge → iterate → watch runs → Disable,
    # and every stage records ok/why/clicks/px-scrolled/url/reload/ms plus a
    # screenshot into results/persona-undergrad.json.
    #
    # A MEASUREMENT, not a gate: most stages are expected red today, so the
    # job is continue-on-error and the spec never stops at the first failure.
    # Secrets exactly as fresh-user-journey: invite minted per run and revoked
    # after, OTP via identity's admin-gated e2e route (lumid-e2e-…@yao.lu
    # only), admin PAT used server-side in node only. The spec disables every
    # strategy it created, revokes the persona's tokens and deletes the
    # account; the sweep catches a crashed run's leftovers (> 90 min old).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    concurrency:
      group: persona-undergrad
      cancel-in-progress: false
    env:
      BASE_URL: https://lum.id
      E2E_PERSONA: "1"
      E2E_ADMIN_PAT: ${{ secrets.E2E_ADMIN_PAT }}
      CI_E2E_LOCAL_OTP: "1"
      LUMID_OTP_TRANSPORT: api
      E2E_PERSONA_OUT: results/persona-undergrad.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Mint invitation code for this run
        run: node ci/fresh-user-ci.mjs mint-invite "e2e:persona-undergrad run ${{ github.run_id }}" 1
      - name: Run undergrad persona journey
        # retries 0: a retry would create a second account and double-submit.
        run: npx playwright test tests/persona-undergrad.spec.ts --project=chromium --retries=0 --reporter=list
      - name: Stage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$E2E_PERSONA_OUT" ]; then
            node -e '
              const s = require("./" + process.env.E2E_PERSONA_OUT);
              const rows = s.stages.map(x => `| ${x.id} | ${x.name} | ${x.skipped ? "skip" : x.ok ? "PASS" : "FAIL"} | ${x.clicks} | ${x.px_scrolled ?? "?"} | ${x.url_survives_reload ?? "?"} | ${Math.round(x.ms/1000)} | ${String(x.why).replace(/\|/g,"\\|").slice(0,200)} |`);
              console.log(["## Undergrad persona — " + s.failed_count + " of " + s.stages.length + " stages failed", "", "| stage | name | result | clicks | px | reload | s | why |", "|---|---|---|---|---|---|---|---|", ...rows, "", "cleanup: `" + JSON.stringify(s.cleanup) + "`"].join("\n"));
            ' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no persona summary written"
          fi
      - name: Revoke invitation code and sweep stale persona accounts
        if: ${{ always() }}
        run: |
          node ci/fresh-user-ci.mjs revoke-invite || true
          node ci/fresh-user-ci.mjs sweep lumid-e2e-persona-ug- 90 || true
      - name: Upload persona results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: persona-undergrad-${{ github.run_id }}
          path: results/
          retention-days: 14
